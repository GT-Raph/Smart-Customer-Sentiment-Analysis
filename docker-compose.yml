services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    env_file: .env
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,dashboard
      CAPTURED_FACES_ROOT: /data/captured_faces
    ports:
      - "8000:8000"
    volumes:
      - captured_faces:/data/captured_faces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      CAPTURED_FACES_ROOT: /data/captured_faces
    ports:
      - "8001:8001"
    volumes:
      - captured_faces:/data/captured_faces
    depends_on:
      dashboard:
        condition: service_healthy
    restart: on-failure

volumes:
  captured_faces:
