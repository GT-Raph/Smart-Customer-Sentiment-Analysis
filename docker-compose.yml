services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    env_file:
      - path: .env
        format: raw
    environment:
      DATABASE_ENGINE: mysql
      MYSQL_HOST: host.docker.internal
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,dashboard
      CAPTURED_FACES_DIR: /data/private_uploads
    ports:
      - "8000:8000"
    volumes:
      - private_uploads:/data/private_uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env
        format: raw
    environment:
      MYSQL_HOST: host.docker.internal
      REDIS_URL: redis://redis:6379/0
      CAPTURED_FACES_DIR: /data/private_uploads
    ports:
      - "8001:8001"
    volumes:
      - private_uploads:/data/private_uploads
    depends_on:
      dashboard:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - path: .env
        format: raw
    environment:
      MYSQL_HOST: host.docker.internal
      REDIS_URL: redis://redis:6379/0
      CAPTURED_FACES_DIR: /data/private_uploads
    volumes:
      - private_uploads:/data/private_uploads
      - model_cache:/root/.deepface
    depends_on:
      dashboard:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

volumes:
  redis_data:
  private_uploads:
  model_cache:
