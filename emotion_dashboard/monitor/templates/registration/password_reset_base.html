<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reset password{% endblock %} | Sentiment Grid</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --page-bg: #070a10;
            --surface: #121824;

            --border: rgba(255, 255, 255, 0.075);
            --border-strong: rgba(255, 255, 255, 0.14);

            --text-main: #f7f8fc;
            --text-soft: #a0aabd;
            --text-muted: #7d8aa3;

            --purple: #7c5cff;
            --purple-light: #a18cff;

            --cyan: #35d7dc;
            --green: #32d69a;
            --red: #ff5e7d;

            --radius-lg: 26px;
            --radius-md: 16px;

            --shadow: 0 30px 90px rgba(0, 0, 0, 0.48);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: dark;
        }

        body {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow-x: hidden;

            padding: 30px;

            color: var(--text-main);

            background:
                radial-gradient(circle at 15% 5%, rgba(124, 92, 255, 0.18), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(53, 215, 220, 0.08), transparent 32%),
                var(--page-bg);

            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .background-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }

        .glow-one {
            top: -180px;
            left: -150px;
            width: 480px;
            height: 480px;
            background: rgba(124, 92, 255, 0.10);
        }

        .glow-two {
            right: -200px;
            bottom: -200px;
            width: 520px;
            height: 520px;
            background: rgba(53, 215, 220, 0.06);
        }

        .login-shell {
            position: relative;
            z-index: 10;

            width: 100%;
            max-width: 440px;
        }

        .login-card {
            position: relative;
            padding: 38px;
            overflow: hidden;

            background:
                radial-gradient(circle at 100% 0%, rgba(124, 92, 255, 0.12), transparent 38%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0)),
                rgba(18, 24, 36, 0.90);

            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;

            background: linear-gradient(90deg, transparent, rgba(161, 140, 255, 0.8), rgba(53, 215, 220, 0.45), transparent);
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 30px;
            text-align: center;
        }

        .brand-mark {
            width: 62px;
            height: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 18px;

            color: white;
            font-size: 1.6rem;

            background: linear-gradient(135deg, var(--purple), #5a78ff);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;

            box-shadow: 0 18px 45px rgba(124, 92, 255, 0.30);
        }

        .brand-kicker {
            margin-bottom: 9px;

            color: var(--purple-light);
            font-size: 0.68rem;
            font-weight: 750;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .brand-title {
            margin: 0;
            color: white;
            font-size: clamp(1.4rem, 5vw, 1.7rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.15;
        }

        .brand-subtitle {
            max-width: 330px;
            margin: 10px auto 0;

            color: var(--text-muted);
            font-size: 0.82rem;
            line-height: 1.65;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;

            padding: 13px 14px;
            margin-bottom: 20px;

            font-size: 0.75rem;
            line-height: 1.55;
            border-radius: 14px;
        }

        .message i {
            flex-shrink: 0;
            margin-top: 1px;
            font-size: 0.95rem;
        }

        .message.error {
            color: #ffb0bf;
            background: rgba(255, 94, 125, 0.08);
            border: 1px solid rgba(255, 94, 125, 0.20);
        }

        .message.success {
            color: #aef3d3;
            background: rgba(50, 214, 154, 0.08);
            border: 1px solid rgba(50, 214, 154, 0.20);
        }

        .message.info {
            color: #bdeff1;
            background: rgba(53, 215, 220, 0.08);
            border: 1px solid rgba(53, 215, 220, 0.20);
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;

            color: var(--text-soft);
            font-size: 0.73rem;
            font-weight: 700;
        }

        .input-shell {
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);

            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-control {
            width: 100%;
            min-height: 54px;
            padding: 0 49px 0 47px;

            color: white;
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;

            background: rgba(255, 255, 255, 0.035);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);

            transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 0.75;
        }

        .form-control:hover {
            background: rgba(255, 255, 255, 0.045);
            border-color: var(--border-strong);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.052);
            border-color: rgba(124, 92, 255, 0.68);
            box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.10);
        }

        .input-shell:focus-within .input-icon {
            color: var(--purple-light);
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 9px;
            transform: translateY(-50%);

            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;
            color: var(--text-muted);
            cursor: pointer;

            background: transparent;
            border: 0;
            border-radius: 11px;

            transition: color 0.2s ease, background 0.2s ease;
        }

        .password-toggle:hover,
        .password-toggle:focus-visible {
            color: white;
            background: rgba(255, 255, 255, 0.055);
        }

        .field-error {
            margin-top: 7px;
            color: #ff90a7;
            font-size: 0.71rem;
            line-height: 1.5;
        }

        .form-group.error .form-control {
            border-color: rgba(255, 94, 125, 0.70);
            box-shadow: 0 0 0 4px rgba(255, 94, 125, 0.08);
        }

        .help-text {
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 0.71rem;
            line-height: 1.6;
        }

        .help-text ul {
            margin: 0;
            padding-left: 18px;
        }

        .help-text li {
            margin-bottom: 2px;
        }

        .errorlist {
            list-style: none;
            margin: 7px 0 0;
            padding: 0;

            color: #ff90a7;
            font-size: 0.71rem;
            line-height: 1.5;
        }

        .login-button {
            position: relative;
            width: 100%;
            min-height: 54px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            margin-top: 8px;
            overflow: hidden;

            color: white;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 750;
            text-decoration: none;
            cursor: pointer;

            background: linear-gradient(135deg, var(--purple), #5d78ff);
            border: 0;
            border-radius: var(--radius-md);

            box-shadow: 0 15px 36px rgba(124, 92, 255, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-button:hover,
        .login-button:focus-visible {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 19px 42px rgba(124, 92, 255, 0.32);
        }

        .login-button:visited {
            color: white;
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button-content {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .login-footer {
            margin-top: 25px;
            padding-top: 21px;
            text-align: center;
            border-top: 1px solid var(--border);
        }

        .login-footer p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.71rem;
            line-height: 1.6;
        }

        .login-footer a,
        .back-link {
            color: var(--purple-light);
            font: inherit;
            font-weight: 700;
            text-decoration: none;
        }

        .login-footer a:hover,
        .back-link:hover {
            color: white;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 0.75rem;
        }

        @media (max-width: 520px) {
            body {
                padding: 18px;
            }

            .login-card {
                padding: 30px 22px;
            }

            .brand-mark {
                width: 56px;
                height: 56px;
                border-radius: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-button,
            .form-control,
            .input-icon {
                transition: none;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="login-shell">
        <section class="login-card">
            <header class="brand">
                <div class="brand-mark">
                    <i class="bi {% block icon %}bi-shield-lock{% endblock %}"></i>
                </div>

                <div class="brand-kicker">Sentiment Grid</div>

                <h1 class="brand-title">{% block heading %}{% endblock %}</h1>

                <p class="brand-subtitle">{% block subheading %}{% endblock %}</p>
            </header>

            {% if messages %}
                {% for message in messages %}
                    <div
                        class="message {% if message.tags == 'error' %}error{% else %}{{ message.tags|default:'info' }}{% endif %}"
                        role="alert"
                    >
                        <i class="bi {% if message.tags == 'error' %}bi-exclamation-circle{% elif message.tags == 'success' %}bi-check-circle{% else %}bi-info-circle{% endif %}"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}{% endblock %}
        </section>
    </main>

    <script>
        document.querySelectorAll(".password-toggle[data-toggle-for]").forEach(function (toggle) {
            toggle.addEventListener("click", function () {
                const input = document.getElementById(toggle.getAttribute("data-toggle-for"));

                if (!input) {
                    return;
                }

                const isPassword = input.type === "password";

                input.type = isPassword ? "text" : "password";

                const icon = toggle.querySelector("i");

                if (icon) {
                    icon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";
                }

                toggle.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
                toggle.setAttribute("aria-pressed", isPassword ? "true" : "false");
            });
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
